{% extends "base.html" %}
{% block title %}{{ title }} &middot; QVS{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
  <p class="text-6xl font-bold tracking-tight text-slate-300">{{ code }}</p>
  <h1 class="mt-4 text-2xl font-semibold tracking-tight text-slate-900">{{ title }}</h1>
  <p class="mt-2 text-sm text-slate-600">{{ description }}</p>
  <div class="mt-8 flex justify-center gap-2">
    <a class="btn-primary" href="{{ url_for('main.index') }}">Go to the dashboard</a>
    {% if not current_user.is_authenticated %}
      <a class="btn-secondary" href="{{ url_for('auth.login') }}">Sign in</a>
    {% endif %}
  </div>
</div>
{% endblock %}
