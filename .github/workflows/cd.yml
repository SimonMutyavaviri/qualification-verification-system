name: CD

# Continuous Delivery to Fly.io.
#
# Deployment is gated: this workflow only runs after CI has completed
# successfully on main. Code that fails the quality gate is never deployed.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying manually?"
        required: true
        default: "Manual deployment"

concurrency:
  # Never let two deployments race each other onto the same app.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # The workflow_run trigger fires for failed CI runs too, so the conclusion
    # must be checked explicitly -- this is the deployment quality gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://qvs-mim736.fly.dev
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Confirm the quality gate passed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual deployment: ${{ inputs.reason }}"
          else
            echo "CI concluded: ${{ github.event.workflow_run.conclusion }}"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          fi

      - name: Set up the Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --strategy rolling

      - name: Verify the deployment is healthy
        run: |
          echo "Waiting for the deployed application to report healthy..."
          for attempt in $(seq 1 30); do
            if curl -fsS https://qvs-mim736.fly.dev/healthz > /tmp/health.json; then
              echo "Deployment healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Post-deployment health check failed."
          exit 1

      - name: Smoke-test the sign-in page
        run: |
          curl -fsS https://qvs-mim736.fly.dev/login | grep -q "Qualification Verification System"
          echo "Live sign-in page served correctly."

      - name: Record the deployment in the job summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| URL | https://qvs-mim736.fly.dev |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Triggered by | ${{ github.event_name }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-on-failure:
    name: Roll back a failed deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Report the previous releases
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::warning::Deployment failed. Recent releases:"
          flyctl releases --app qvs-mim736 || true
          echo "To roll back: flyctl releases rollback --app qvs-mim736"
