name: CI

# Continuous Integration: every push and every pull request runs the full
# quality gate. The gate is what makes the requirement verification automatic
# rather than a promise -- a change that breaks a rule cannot be merged.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: no point spending
  # runner minutes on a commit that has already been superseded.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------------
  # Gate 1: coding standards and static analysis. Fast, so it runs first and
  # gives quick feedback before the slower test job.
  # -------------------------------------------------------------------------
  quality:
    name: Lint, format and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Security scan with Bandit
        # Fails the build on any medium- or high-severity finding.
        run: bandit -c pyproject.toml -r app -ll

      - name: Bandit report artifact
        if: always()
        run: bandit -c pyproject.toml -r app -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # Gate 2: unit tests. Fast, isolated business-logic checks.
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -m unit -v --no-cov --junitxml=reports/junit-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: reports/junit-unit.xml
          retention-days: 30

  # -------------------------------------------------------------------------
  # Gate 3: integration tests against a real PostgreSQL, matching production.
  # SQLite would pass tests that Postgres rejects, so the integration suite
  # runs on the engine the application is actually deployed against.
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qvs
          POSTGRES_PASSWORD: qvs-ci-password
          POSTGRES_DB: qvs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qvs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://qvs:qvs-ci-password@localhost:5432/qvs_test
        run: pytest tests/integration -m integration -v --no-cov --junitxml=reports/junit-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          retention-days: 30

  # -------------------------------------------------------------------------
  # Gate 4: the coverage quality gate. Fails the build below the threshold in
  # pyproject.toml (--cov-fail-under=85).
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage quality gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the full suite with coverage
        run: pytest --junitxml=reports/junit-all.xml

      - name: Summarise coverage in the job summary
        if: always()
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("reports/coverage.xml").getroot()
              rate = float(root.get("line-rate", 0)) * 100
              print(f"Line coverage: **{rate:.2f}%** (gate: 85%)")
          except Exception as exc:
              print(f"Coverage report unavailable: {exc}")
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage/
            reports/coverage.xml
            reports/junit-all.xml
          retention-days: 30

  # -------------------------------------------------------------------------
  # Gate 5: the container must build and actually serve a healthy response.
  # A build that succeeds but produces an image that will not start is not a
  # passing build.
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: qvs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name qvs-ci -p 8080:8080 \
            -e SECRET_KEY=ci-only-ephemeral-key-not-a-real-secret \
            -e DATABASE_URL=sqlite:////tmp/qvs-ci.db \
            -e SESSION_COOKIE_SECURE=false \
            qvs:ci

      - name: Wait for the health check to pass
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /tmp/health.json; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy. Logs:"
          docker logs qvs-ci
          exit 1

      - name: Verify the sign-in page is served
        run: |
          curl -fsS http://localhost:8080/login | grep -q "Qualification Verification System"
          echo "Sign-in page served correctly."

      - name: Container logs
        if: always()
        run: docker logs qvs-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f qvs-ci || true

  # -------------------------------------------------------------------------
  # The single gate that branch protection requires. It fails if any upstream
  # job failed, so one required check covers the whole pipeline.
  # -------------------------------------------------------------------------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, coverage, docker-build]
    if: always()
    steps:
      - name: Evaluate every upstream job
        run: |
          echo "quality:            ${{ needs.quality.result }}"
          echo "unit-tests:         ${{ needs.unit-tests.result }}"
          echo "integration-tests:  ${{ needs.integration-tests.result }}"
          echo "coverage:           ${{ needs.coverage.result }}"
          echo "docker-build:       ${{ needs.docker-build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Quality gate FAILED - this change must not be merged or deployed."
            exit 1
          fi
          echo "Quality gate PASSED."
