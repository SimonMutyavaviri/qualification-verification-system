# Local production-like stack: the application on PostgreSQL, as deployed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qvs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qvs-local-dev}
      POSTGRES_DB: qvs
    volumes:
      - qvs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvs -d qvs"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the app container needs to reach it.
    expose:
      - "5432"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      # Compose substitutes these from your .env file; there are no defaults
      # for SECRET_KEY on purpose, so an unconfigured stack fails loudly.
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://qvs:${POSTGRES_PASSWORD:-qvs-local-dev}@db:5432/qvs
      SESSION_COOKIE_SECURE: "false"
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  qvs-data:
